<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>diyPOOL</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="diyPOOL">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a5f69" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d2427" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --muted:#6c6c70; --line:#dcdce1;
  --bar:#0a5f69; --accent:#0a7f8c; --accent-soft:#e0f2f4; --accent-text:#ffffff;
  --ok:#1d7f46; --ok-soft:#e3f4ea; --warn:#9a5b00; --warn-soft:#fdf0d9;
  --bad:#c0392b; --bad-soft:#fbe5e2; --chip:#e7e7ec; --tab:rgba(249,249,251,.94);
  --input:#f4f4f7; --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1c1c1e; --text:#f2f2f7; --muted:#9a9aa1; --line:#38383c;
    --bar:#0d2427; --accent:#3cc0ce; --accent-soft:#12343a; --accent-text:#00262b;
    --ok:#4cc97a; --ok-soft:#163222; --warn:#f0a63a; --warn-soft:#3a2a10;
    --bad:#ff6b5e; --bad-soft:#3d1a17; --chip:#2c2c2f; --tab:rgba(18,18,20,.94);
    --input:#2a2a2d; --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}

/* Kopfzeile */
.topbar{position:sticky;top:0;z-index:20;background:var(--bar);color:#fff;
  padding:calc(env(safe-area-inset-top) + 8px) 16px 10px}
.topbar-inner{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.7}
.topbar h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.banner{max-width:720px;margin:10px auto 0;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:rgba(255,255,255,.14);border-radius:10px;padding:8px 8px 8px 12px;font-size:14px}
.banner button{background:#fff;color:var(--bar);border:0;border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;white-space:nowrap}
@media (prefers-color-scheme: dark){ .banner button{color:#0d2427} }

main{padding:14px 16px calc(92px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}

/* Tab-Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tab);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px)}
.tabbar-inner{display:flex;max-width:720px;margin:0 auto}
.tabbar button{flex:1;background:none;border:0;padding:7px 0 5px;color:var(--muted);font-size:10.5px;font-weight:500;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.active{color:var(--accent)}

/* Bausteine */
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2,.card h3{margin:0 0 10px;font-size:17px;font-weight:650}
.card.flush{padding:0;overflow:hidden}
.muted{color:var(--muted)} .small{font-size:13.5px} .center{text-align:center}
.lead{margin:0 0 14px;color:var(--muted);font-size:15px}
.grouphead{margin:18px 4px 6px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.grouphead:first-child{margin-top:4px}
.note{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:14.5px}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;
  padding:11px 16px;font-weight:600;font-size:16px;background:var(--chip);color:var(--text);text-decoration:none;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-text)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{display:flex;width:100%}
.btn.big{padding:16px 20px;font-size:17px;width:100%}
.btn.small{padding:7px 12px;font-size:14px;min-height:36px;border-radius:9px}
.btn:disabled{opacity:.45}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btnrow .btn{flex:1}
.stack > * + *{margin-top:10px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;font-size:15px;padding:10px 4px}

.field{display:block;margin-bottom:12px}
.field > span{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin:0 0 5px 2px}
input[type=text],input[type=search],input[type=password],input[type=number],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--input);border-radius:10px;padding:11px 12px;font-size:16px;outline:none;
  -webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{resize:vertical;min-height:80px;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.inline{display:flex;gap:8px;align-items:center}
.inline input{flex:1}

.qtyfield{display:flex;align-items:stretch;gap:8px}
.qtyfield input{text-align:center;font-weight:650;font-size:18px;flex:1;min-width:0}
.qbtn{width:52px;border:0;border-radius:10px;background:var(--chip);font-size:24px;font-weight:500;line-height:1}

/* Suche, Chips */
.searchbar{margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -16px 4px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;border-radius:999px;padding:7px 12px;background:var(--chip);font-size:14px;font-weight:550;white-space:nowrap}
.chip span{opacity:.6;margin-left:3px;font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-text)}
.chip.on span{opacity:.85}

/* Inventarliste */
.row{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 0}
.row-name{display:block;font-weight:600;font-size:16px;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.row-sub{display:block;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.stepper button{width:38px;height:38px;border:0;border-radius:10px;background:var(--chip);font-size:21px;line-height:1}
.stepper button:disabled{opacity:.35}
.qty{min-width:40px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.row.zero .qty{color:var(--bad)}
.stats{margin:16px 0 0;text-align:center;color:var(--muted);font-size:13.5px}

/* Erfassen */
.thumb{display:block;width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:var(--input);margin-bottom:12px}
.badge{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 9px;margin-left:6px;vertical-align:1px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)}
.radio{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-weight:550}
.radio input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:0 0 auto}
.indent{margin:2px 0 8px 30px}
.dim{opacity:.45}
.caphead{padding:0 0 4px;align-items:flex-start}
.caphead b{font-size:16.5px}
.capsub{display:block;font-weight:400;margin-top:1px}
.capbody{margin-top:10px}
.capitem.off .capbody{display:none}
.capitem.off .caphead b{color:var(--muted);font-weight:500;text-decoration:line-through}
.capmerge{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--chip);border-top-color:var(--accent);animation:spin .9s linear infinite;margin:6px auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Segment */
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-size:14.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Prüfergebnis */
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pill{font-size:13.5px;font-weight:650;border-radius:999px;padding:4px 10px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neutral{background:var(--chip);color:var(--muted)}
.pos{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.pos:first-child{border-top:0}
.dot{flex:0 0 auto;width:11px;height:11px;border-radius:50%;margin-top:6px}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.pos-body{flex:1;min-width:0}
.pos-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pos-name{font-weight:600;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.pos-status{flex:0 0 auto;font-size:13px;font-weight:650}
.pos-status.ok{color:var(--ok)} .pos-status.warn{color:var(--warn)} .pos-status.bad{color:var(--bad)}
.pos-sub{font-size:13.5px;color:var(--muted);margin-top:2px;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.pos-alt{font-size:13.5px;margin-top:6px;padding:7px 10px;border-radius:9px;background:var(--accent-soft)}

/* Ideen */
.idea h3{margin-bottom:4px}
.idea-meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.idea p{margin:0 0 10px;font-size:15px}
.parts{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.parts li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.parts li:last-child{border-bottom:0}
.parts .dot{margin-top:5px;width:9px;height:9px}
.parts .pn{flex:1;min-width:0;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.parts .ps{flex:0 0 auto;font-size:13px;color:var(--muted)}

/* Einstellungen */
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ic.sm{width:22px;height:22px;color:var(--accent);margin-right:4px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:120px;padding:18px 10px 14px;border:0;border-radius:16px;background:var(--card);box-shadow:var(--shadow);color:var(--text);transition:transform .1s}
.tile .ic{width:40px;height:40px;stroke-width:1.4;color:var(--accent)}
.tile span{font-size:15px;font-weight:400;line-height:1.25;text-align:center;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.tile:active{transform:scale(.97)}
.crumbs{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.crumb-back{width:38px;height:38px;border:0;border-radius:10px;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--text)}
.crumb-back .ic{width:20px;height:20px;stroke-width:2}
.crumb-path{display:flex;flex-wrap:wrap;align-items:center;gap:0 4px;min-width:0}
.crumb{background:none;border:0;padding:4px 1px;color:var(--accent);font-weight:600;font-size:14.5px}
.crumb.cur{color:var(--text)}
.crumbs .sep{color:var(--muted);font-size:14.5px}
.iconsel{display:flex;align-items:center;gap:12px}
.iconcur{width:52px;height:52px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.iconcur .ic{width:30px;height:30px}
.iconpick{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.pick{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--input);display:flex;align-items:center;justify-content:center;color:var(--text);padding:0}
.pick.on{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.catrow{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.catrow:first-of-type{border-top:0}
.catrow .cn{flex:1;min-width:0;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.catrow .cc{color:var(--muted);font-size:13.5px;margin-right:4px;font-variant-numeric:tabular-nums}
.iconbtn{width:38px;height:38px;border:0;border-radius:10px;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.iconbtn.danger{background:var(--bad-soft);color:var(--bad)}
.iconbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-of-type{border-top:0}
.kv span:last-child{color:var(--muted);text-align:right}

/* Bottom Sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .2s}
.sheet-panel{position:relative;width:100%;max-width:720px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--card);border-radius:18px 18px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .22s ease-out}
.sheet.open .sheet-bg{opacity:1}
.sheet.open .sheet-panel{transform:none}
.sheet-grip{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 14px;font-size:19px}
.sheet .btn.danger{margin-top:14px}

/* Toast */
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;
  max-width:520px;margin:0 auto;background:#1c1c1e;color:#fff;border-radius:12px;padding:12px 14px;font-size:15px;
  box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.bad{background:#a5281c}
@media (prefers-color-scheme: dark){ .toast{background:#3a3a3c} }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div>
      <div class="brand">diyPOOL</div>
      <h1 id="title">Inventar</h1>
    </div>
  </div>
  <div class="banner" id="backupBanner" hidden>
    <span>Ungesicherte Änderungen</span>
    <button type="button" id="bannerBackup">Jetzt sichern</button>
  </div>
</header>

<main>
  <section id="tab-inventar" class="tab">
    <div id="installHint"></div>
    <div class="searchbar"><input id="invSearch" type="search" placeholder="Suchen nach Name oder Kennwerten" autocomplete="off" autocorrect="off" spellcheck="false"></div>
    <div id="invCrumbs"></div>
    <div id="invList"></div>
    <p id="invStats" class="stats"></p>
  </section>

  <section id="tab-erfassen" class="tab" hidden>
    <div id="capView"></div>
  </section>

  <section id="tab-pruefen" class="tab" hidden>
    <div id="chkView"></div>
  </section>

  <section id="tab-ideen" class="tab" hidden>
    <div id="ideaView"></div>
  </section>

  <section id="tab-einstellungen" class="tab" hidden>
    <div id="setView"></div>
  </section>
</main>

<nav class="tabbar" aria-label="Navigation">
  <div class="tabbar-inner">
    <button type="button" data-tab="inventar" class="active">
      <svg viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/></svg>Inventar</button>
    <button type="button" data-tab="erfassen">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.8"/></svg>Erfassen</button>
    <button type="button" data-tab="pruefen">
      <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m8.5 13 2.5 2.5 4.5-5"/></svg>Prüfen</button>
    <button type="button" data-tab="ideen">
      <svg viewBox="0 0 24 24"><path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.1V16h5v-.1c0-.8.4-1.5 1.1-2.1A6 6 0 0 0 12 3z"/></svg>Ideen</button>
    <button type="button" data-tab="einstellungen">
      <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Einstellungen</button>
  </div>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true"><div class="sheet-grip"></div><div id="sheetBody"></div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<input type="file" id="camInput" class="vh" accept="image/*" capture="environment">
<input type="file" id="libInput" class="vh" accept="image/*">
<input type="file" id="importInput" class="vh">

<script>
'use strict';

/* =========================================================
   Grundeinstellungen
   ========================================================= */
const APP_VERSION = '1.3';
const API_URL = 'https://api.anthropic.com/v1/messages';
const API_VERSION = '2023-06-01';
const DEFAULT_CATS = [
  'Passive Bauteile', 'Halbleiter', 'Mikrocontroller und Module', 'Sensoren',
  'Aktoren und Motoren', 'Stromversorgung und Akkus', 'Kabel und Steckverbinder',
  'Mechanik und Befestigung', 'Werkzeug', 'Verbrauchsmaterial'
];
const MODELS = [
  { id: 'claude-sonnet-5-5', label: 'Claude Sonnet 5.5 (Standard)' },
  { id: 'claude-haiku-5-5', label: 'Claude Haiku 5.5 (schnell, günstig)' },
  { id: 'claude-opus-5-5', label: 'Claude Opus 5.5 (genau, teurer)' },
  { id: 'custom', label: 'Eigene Modell-ID' }
];
const K = { items: 'diypool.items', cats: 'diypool.categories', subcats: 'diypool.subcategories', icons: 'diypool.icons', settings: 'diypool.settings', meta: 'diypool.meta' };
const TAB_TITLES = { inventar: 'Inventar', erfassen: 'Erfassen', pruefen: 'Material prüfen', ideen: 'Projektideen', einstellungen: 'Einstellungen' };

/* =========================================================
   Hilfsfunktionen
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  settings: Object.assign({ apiKey: '', model: 'claude-sonnet-5-5', customModel: '' }, load(K.settings, {})),
  meta: Object.assign({ lastChange: 0, lastBackup: 0, hintDismissed: false }, load(K.meta, {}))
};
if (!state.categories.length) state.categories = DEFAULT_CATS.slice();
{
  const storedSub = load(K.subcats, null);
  state.subcats = sanitizeSubcats(storedSub, state.categories);
  state.catIcons = sanitizeIcons(load(K.icons, null), state.categories);
  if (!storedSub) {
    if (state.items.length) state.meta.subAssignPending = true;
    store(K.subcats, state.subcats); store(K.icons, state.catIcons); store(K.meta, state.meta);
  }
}

  state.items.forEach(i => { if (i.kategorie && !s.includes(i.kategorie)) s.push(i.kategorie); });

  const ok1 = store(K.items, state.items);

  state.meta.lastChange = Date.now();

}

function showTab(t) {
  ui.tab = t;
  document.querySelectorAll('.tab').forEach(s => { s.hidden = s.id !== 'tab-' + t; });
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  $('#title').textContent = TAB_TITLES[t];
  window.scrollTo(0, 0);
  if (t === 'inventar') renderInventory();
  if (t === 'erfassen') renderCapture();
  if (t === 'pruefen') renderCheck();
  if (t === 'ideen') renderIdeas();
  if (t === 'einstellungen') renderSettings();
}

function openSheet(html, onMount) {
  const s = $('#sheet');
  $('#sheetBody').innerHTML = html;
  s.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('open')));
  if (onMount) onMount($('#sheetBody'));
}
function closeSheet() {
  const s = $('#sheet');
  s.classList.remove('open');
  setTimeout(() => { s.hidden = true; $('#sheetBody').innerHTML = ''; }, 230);
}

           ${noKey ? '<p class="note warn" style="margin:0 0 10px">Dafür braucht es zuerst den API-Schlüssel in den Einstellungen.</p>' : ''}
           <div class="btnrow" style="margin-top:0"><button type="button" class="btn" id="subLater">Später</button>
           ${noKey ? '<button type="button" class="btn primary" data-go="einstellungen">Einstellungen</button>' : '<button type="button" class="btn primary" id="subAssign">Jetzt zuordnen</button>'}</div>`}
    </div>`);
  }
  $('#installHint').innerHTML = hints.join('');

}

function usedSubs(cat) {
  const used = new Set(state.items.filter(i => i.kategorie === cat).map(i => i.unterkategorie || ''));
  const order = subsOf(cat).map(s => s.name);
  const res = order.filter(n => used.has(n));
  [...used].filter(n => n && !order.includes(n)).sort((a, b) => a.localeCompare(b, 'de')).forEach(n => res.push(n));
  if (used.has('')) res.push('');
  return res;
}

function invLevel() {
  const nav = ui.nav;
  if (nav.cat !== null && !state.items.some(i => i.kategorie === nav.cat)) { nav.cat = null; nav.sub = null; }
  if (nav.cat !== null && nav.sub !== null && !state.items.some(i => i.kategorie === nav.cat && (i.unterkategorie || '') === nav.sub)) nav.sub = null;
  if (nav.cat === null) return 'root';
  if (nav.sub !== null) return 'items';
  return usedSubs(nav.cat).length >= 2 ? 'subs' : 'items';
}

function navUp() {
  const nav = ui.nav;
  if (nav.sub !== null) {
    nav.sub = null;
    if (usedSubs(nav.cat).length < 2) nav.cat = null;
  } else nav.cat = null;
  renderInventory(); window.scrollTo(0, 0);
}

function crumbsHtml(lvl) {
  if (lvl === 'root') return '';
  const { cat, sub } = ui.nav;
  const parts = [`<button type="button" class="crumb" data-nav="root">Inventar</button>`];
  if (sub === null) parts.push(`<span class="crumb cur">${esc(cat)}</span>`);
  else parts.push(`<button type="button" class="crumb" data-nav="cat">${esc(cat)}</button>`, `<span class="crumb cur">${esc(sub || SONSTIGES)}</span>`);
  return `<div class="crumbs"><button type="button" class="crumb-back" data-nav="up" aria-label="Zurück">${ICON_BACK}</button><div class="crumb-path">${parts.join('<span class="sep">›</span>')}</div></div>`;
}

function renderInventoryList() {
  const list = $('#invList');
  const crumbs = $('#invCrumbs');
  const terms = norm(ui.search).split(' ').filter(Boolean);

  if (!state.items.length) {
    crumbs.innerHTML = '';
    list.innerHTML = `<div class="card center">
      <h3>Noch keine Bauteile erfasst</h3>
      <p class="lead">Fotografiere Bauteile, die KI schlägt Name, Kategorie, Stückzahl und Kennwerte vor.</p>
      <button type="button" class="btn primary block" data-go="erfassen">Erstes Bauteil erfassen</button>
    </div>`;
    $('#invStats').textContent = '';
    return;
  }

  if (terms.length) {
    crumbs.innerHTML = '';
    const filtered = sortedItems().filter(it => terms.every(t => norm([it.name, it.kennwerte, it.kategorie, it.unterkategorie || SONSTIGES].join(' ')).includes(t)));
    if (!filtered.length) list.innerHTML = '<div class="card center muted">Keine Treffer.</div>';
    else {
      const groups = new Map();
      filtered.forEach(it => { const k = it.kategorie || 'Ohne Kategorie'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(it); });
      list.innerHTML = allCats().concat(['Ohne Kategorie']).filter(c => groups.has(c)).map(c => `
        <h3 class="grouphead">${esc(c)}</h3>
        <div class="card flush">${groups.get(c).map(it => rowHtml(it, true)).join('')}</div>`).join('');
    }
    $('#invStats').textContent = `${filtered.length} ${filtered.length === 1 ? 'Treffer' : 'Treffer'}`;
    return;
  }

  const lvl = invLevel();
  crumbs.innerHTML = crumbsHtml(lvl);
  const { cat, sub } = ui.nav;
  let scope = state.items;

  if (lvl === 'root') {
    const cats = allCats().filter(c => state.items.some(i => i.kategorie === c));
    list.innerHTML = `<div class="tiles">${cats.map(c => `<button type="button" class="tile" data-navcat="${esc(c)}">${icon(catIcon(c))}<span>${esc(c)}</span></button>`).join('')}</div>`;

  } else {
    scope = sortedItems().filter(i => i.kategorie === cat && (sub === null || (i.unterkategorie || '') === sub));
    list.innerHTML = `<div class="card flush">${scope.map(it => rowHtml(it, false)).join('')}</div>`;

  $('#invStats').textContent = `${scope.length} ${scope.length === 1 ? 'Eintrag' : 'Einträge'} · ${total} Stück${lvl === 'root' ? ' insgesamt' : ''}`;
}

/* Einmalige Zuordnung bestehender Bauteile zu Unterkategorien */
const ASSIGN_SYSTEM = `Du ordnest Bauteile eines privaten Elektronik- und Werkzeuglagers Unterkategorien zu.
Für jedes Bauteil wählst du genau eine Unterkategorie aus der Liste seiner eigenen Kategorie. Schreibe den Namen der Unterkategorie exakt wie in der Liste.
Passt keine Unterkategorie eindeutig, gib einen leeren String zurück, dann bleibt das Bauteil in «Sonstiges». Rate nicht.
Gib für jedes Bauteil die ID unverändert zurück.`;

function assignTool() {
  return {
    name: 'unterkategorien_zuordnen',
    input_schema: {
      type: 'object',
      properties: {
        zuordnungen: {
          type: 'array',
          items: {
            type: 'object',
            properties: { id: { type: 'string' }, unterkategorie: { type: 'string', description: 'Name aus der Liste der Kategorie, sonst leer' } },
            required: ['id', 'unterkategorie']
          }
        }
      },
      required: ['zuordnungen']
    }
  };
}

async function assignSubcategories() {
  const todo = pendingSubItems();
  if (!todo.length) { state.meta.subAssignPending = false; store(K.meta, state.meta); toast('Alle Bauteile sind bereits zugeordnet.'); renderInventory(); return; }
  ui.assigning = true; renderInventory();
  if (ui.tab === 'einstellungen') renderSettings();
  let done = 0;
  try {
    for (let i = 0; i < todo.length; i += 120) {
      const chunk = todo.slice(i, i + 120);
      const r = await callClaude({
        system: ASSIGN_SYSTEM, tool: assignTool(), maxTokens: 16000, timeoutMs: 240000,
        content: [{ type: 'text', text: `Unterkategorien je Kategorie:\n${subcatContext()}\n\nBauteile (ID | Name | Kategorie | Kennwerte):\n${chunk.map(it => `[${it.id}] ${it.name} | ${it.kategorie}${it.kennwerte ? ' | ' + it.kennwerte.replace(/\s+/g, ' ') : ''}`).join('\n')}` }]
      });
      (Array.isArray(r.zuordnungen) ? r.zuordnungen : []).forEach(z => {
        const it = byId(String(z.id || '').replace(/^\[|\]$/g, ''));
        if (!it || it.unterkategorie) return;
        const m = matchSub(it.kategorie, z.unterkategorie);
        if (m) { it.unterkategorie = m; it.geaendert = Date.now(); done++; }
      });
    }
    state.meta.subAssignPending = false;
    toast(`${done} von ${todo.length} Bauteilen zugeordnet.${done < todo.length ? ' Der Rest bleibt in «Sonstiges».' : ''}`);
  } catch (e) {
    toast(e instanceof AppError ? e.message : 'Unerwarteter Fehler: ' + e.message, true);
  } finally {
    ui.assigning = false;
    saveData();
    renderInventory();
    if (ui.tab === 'einstellungen') renderSettings();
  }
}

/* =========================================================
   KI-Anbindung
   ========================================================= */
function currentModel() {
  const s = state.settings;
  return s.model === 'custom' ? (s.customModel || '').trim() || 'claude-sonnet-5-5' : s.model;
}

function apiErrorMessage(status, data) {
  const raw = data && data.error && data.error.message ? String(data.error.message) : '';
  const lower = raw.toLowerCase();
  let msg;
  if (status === 401) msg = 'Der API-Schlüssel ist ungültig. Bitte in den Einstellungen prüfen.';
  else if (status === 403) msg = 'Zugriff verweigert. Bitte die Berechtigungen des API-Schlüssels prüfen.';
  else if (status === 404) msg = 'Das gewählte Modell wurde nicht gefunden. Bitte das Modell in den Einstellungen prüfen.';
  else if (status === 400 && lower.includes('credit')) msg = 'Das Guthaben im Anthropic-Konto ist aufgebraucht.';
  else if (status === 413) msg = 'Die Anfrage ist zu gross (z. B. Bild oder Inventar).';
  else if (status === 429) msg = 'Zu viele Anfragen oder Limit erreicht. Bitte kurz warten und erneut versuchen.';
  else if (status === 529 || status >= 500) msg = 'Der KI-Dienst ist gerade überlastet oder gestört. Bitte später erneut versuchen.';
  else msg = `Die KI-Anfrage ist fehlgeschlagen (Status ${status}).`;
  return raw ? `${msg} (Meldung: ${raw})` : msg;
}

function extractJson(text) {
  const a = text.indexOf('{'), b = text.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  try { return JSON.parse(text.slice(a, b + 1)); } catch (e) { return null; }
}

// Wandelt ein Tool-Schema in ein Schema für Structured Outputs um:
// jedes Objekt erhält additionalProperties:false, nicht unterstützte Zahlen-/Längengrenzen werden entfernt.
function strictSchema(node) {
  if (Array.isArray(node)) return node.map(strictSchema);
  if (!node || typeof node !== 'object') return node;
  const out = {};
  for (const [k, v] of Object.entries(node)) {
    if (['minimum', 'maximum', 'exclusiveMinimum', 'exclusiveMaximum', 'multipleOf', 'minLength', 'maxLength', 'maxItems'].includes(k)) continue;
    out[k] = (k === 'properties')
      ? Object.fromEntries(Object.entries(v).map(([pk, pv]) => [pk, strictSchema(pv)]))
      : strictSchema(v);
  }
  if (out.type === 'object') out.additionalProperties = false;
  return out;
}

async function callClaude({ system, content, tool, maxTokens = 1024, timeoutMs = 120000 }) {
  const key = (state.settings.apiKey || '').trim();
  if (!key) throw new AppError('Es ist kein API-Schlüssel hinterlegt. Bitte zuerst in den Einstellungen eintragen.');
  if (navigator.onLine === false) throw new AppError('Keine Internetverbindung. Die KI-Funktionen brauchen Internet.');

  const body = { model: currentModel(), max_tokens: maxTokens, messages: [{ role: 'user', content }] };
  if (system) body.system = system;
  if (tool) body.output_config = { format: { type: 'json_schema', schema: strictSchema(tool.input_schema) } };

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': key,
        'anthropic-version': API_VERSION,
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
  } catch (e) {
    throw new AppError(e.name === 'AbortError'
      ? 'Die KI hat zu lange nicht geantwortet. Bitte erneut versuchen.'
      : 'Die Verbindung zur KI ist fehlgeschlagen. Bitte Internetverbindung prüfen.');
  } finally { clearTimeout(timer); }

  let data = null;
  try { data = await res.json(); } catch (e) { /* keine JSON-Antwort */ }
  if (!res.ok) throw new AppError(apiErrorMessage(res.status, data));
  if (!data || !Array.isArray(data.content)) throw new AppError('Die Antwort der KI war unvollständig.');
  if (!tool) return data;
  if (data.stop_reason === 'refusal') throw new AppError('Die KI hat die Anfrage abgelehnt. Bitte mit einem anderen Foto oder Text erneut versuchen.');
  if (data.stop_reason === 'max_tokens') throw new AppError('Die Antwort der KI wurde abgeschnitten, weil sie zu lang war. Bitte die Anfrage kürzen oder erneut versuchen.');
  const text = data.content.filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
  let parsed = null;
  try { parsed = JSON.parse(text); } catch (e) { parsed = extractJson(text); }
  if (parsed && typeof parsed === 'object') return parsed;
  throw new AppError('Die Antwort der KI konnte nicht ausgewertet werden. Bitte erneut versuchen.');
}

function inventoryContext() {
  if (!state.items.length) return '(Inventar ist leer)';

}

const cap = { phase: 'idle', img: null, b64: null, items: null, note: '', erkannt: true, error: null };

function resetCapture() { Object.assign(cap, { phase: 'idle', img: null, b64: null, items: null, note: '', erkannt: true, error: null }); renderCapture(); }

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { resolve(img); setTimeout(() => URL.revokeObjectURL(url), 1000); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new AppError('Das Bild konnte nicht gelesen werden.')); };
    img.src = url;
  });
}

async function prepareImage(file) {
  const img = await loadImage(file);
  const MAX = 1568;
  const w = img.naturalWidth, h = img.naturalHeight;
  if (!w || !h) throw new AppError('Das Bild ist leer oder beschädigt.');
  const scale = Math.min(1, MAX / Math.max(w, h));
  const cw = Math.round(w * scale), ch = Math.round(h * scale);
  const canvas = document.createElement('canvas');
  canvas.width = cw; canvas.height = ch;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch);
  ctx.drawImage(img, 0, 0, cw, ch);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  return { dataUrl, b64: dataUrl.split(',')[1] };
}

const REC_SYSTEM = `Du hilfst beim Inventarisieren eines privaten Lagers mit Elektronikbauteilen, Hardware, Mechanikteilen, Werkzeug und Verbrauchsmaterial.
Das Foto kann einen einzigen oder mehrere verschiedene Bauteiltypen zeigen.

Vorgehen:
1. Unterscheide alle Bauteiltypen auf dem Foto. Jeder Typ wird ein eigener Eintrag in bauteile. Trenne nach allem, was für ein Inventar wichtig ist: LEDs nach Farbe, Grösse und Bauform, Widerstände nach Wert, Kondensatoren nach Kapazität, Schrauben nach Gewinde und Länge, Module nach Typ. Gleiche Teile fasst du in einem Eintrag zusammen. Jedes Teil wird nur in einem Eintrag gezählt.
2. Gib jedem Typ eine kurze, eindeutige deutsche Bezeichnung, wie man sie in einem Inventar verwendet, z. B. «Widerstand 220 Ω», «LED rot 5 mm», «ESP32-DevKitC V4», «Zylinderkopfschraube M3×10». Verwende die Schweizer Schreibweise (ss statt ß).
3. Wähle pro Typ die passendste Kategorie aus der vorgegebenen Liste und dazu die passendste Unterkategorie aus der Liste dieser Kategorie. Passt keine Unterkategorie eindeutig, setze unterkategorie auf einen leeren String.
4. Zähle pro Typ die sichtbaren Exemplare. Wenn Teile verdeckt, gestapelt oder verpackt sind, schätze und setze zaehlung auf «geschaetzt» oder bei grosser Unsicherheit auf «unsicher». Steht auf einer Verpackung eine Menge, darfst du diese verwenden und das im Hinweis erwähnen.
5. Notiere pro Typ technische Kennwerte, die auf dem Foto tatsächlich erkennbar sind (Aufdruck, Bauform, Gewinde, Länge, Farbringe). Erfinde nichts. Was nicht erkennbar ist, lässt du weg. Ist ein Wert nur vermutet, schreibe «vermutlich» davor. Farben von Widerstandsringen sind auf Fotos oft verfälscht: Gib einen Widerstandswert nur an, wenn die Ringe klar lesbar sind, sonst weise darauf hin.
6. Beschreibe in ort kurz, wo der Typ auf dem Foto liegt (z. B. «oben links», «mittlere Reihe»), damit die Person die Einträge auf dem Foto wiederfindet. Ordne die Einträge von oben links nach unten rechts.
7. Prüfe pro Typ, ob er bereits im Inventar steht. Setze match_id nur, wenn es eindeutig derselbe Bauteiltyp mit denselben Kennwerten ist, sonst einen leeren String. Erfinde keine IDs.
8. Schreibe in den hinweis eines Typs kurz, was bei diesem Typ unsicher ist. Im übergeordneten hinweis vermerkst du, wenn Typen nicht sicher unterscheidbar sind oder Teile verdeckt sein könnten. Leer lassen, wenn nichts zu beachten ist.
Ist auf dem Foto kein Bauteil, Material oder Werkzeug erkennbar, setze erkannt auf false, lasse bauteile leer und erkläre im übergeordneten Hinweis kurz, warum.`;

function recognitionTool() {
  return {
    name: 'bauteile_erfassen',
    description: 'Gibt die auf dem Foto erkannten Bauteiltypen zurück.',
    input_schema: {
      type: 'object',
      properties: {
        erkannt: { type: 'boolean', description: 'false, wenn kein Bauteil, Material oder Werkzeug erkennbar ist' },
        hinweis: { type: 'string', description: 'Übergeordneter Hinweis zum ganzen Foto, sonst leer' },
        bauteile: {
          type: 'array',
          items: {
            type: 'object',
            properties: {
              name: { type: 'string', description: 'Kurze deutsche Inventarbezeichnung' },
              kategorie: { type: 'string', enum: state.categories.slice() },
              unterkategorie: { type: 'string', description: 'Name aus der Unterkategorien-Liste der Kategorie, sonst leer' },
              stueckzahl: { type: 'integer', minimum: 0 },
              zaehlung: { type: 'string', enum: ['gezaehlt', 'geschaetzt', 'unsicher'] },
              kennwerte: { type: 'string', description: 'Erkennbare technische Kennwerte, sonst leer' },
              ort: { type: 'string', description: 'Kurze Lagebeschreibung auf dem Foto' },
              match_id: { type: 'string', description: 'ID eines identischen bestehenden Inventareintrags, sonst leerer String' },
              hinweis: { type: 'string', description: 'Kurzer Hinweis zu Unsicherheiten bei diesem Typ, sonst leer' }
            },
            required: ['name', 'kategorie', 'unterkategorie', 'stueckzahl', 'zaehlung', 'kennwerte', 'ort', 'match_id', 'hinweis']
          }
        }
      },
      required: ['erkannt', 'hinweis', 'bauteile']
    }
  };
}

function matchCategory(c) {
  const v = String(c || '').trim();
  return state.categories.find(x => norm(x) === norm(v)) || v;
}

async function handlePhoto(file) {
  if (!file) return;
  cap.phase = 'loading'; cap.error = null; cap.items = null; cap.img = null;
  renderCapture();
  try {
    const { dataUrl, b64 } = await prepareImage(file);
    cap.img = dataUrl; cap.b64 = b64;
    renderCapture();
    await runRecognition();
  } catch (e) {
    cap.phase = 'error'; cap.error = e instanceof AppError ? e.message : 'Unerwarteter Fehler: ' + e.message;
    renderCapture();
  }
}

function emptyCapItem() {
  return { sel: true, name: '', kategorie: state.categories[0], unterkategorie: '', stueckzahl: 1, zaehlung: 'unsicher', kennwerte: '', ort: '', hinweis: '', matched: false, mode: 'new', target: '' };
}

async function runRecognition() {
  cap.phase = 'loading'; cap.error = null;
  renderCapture();
  try {
    const r = await callClaude({
      system: REC_SYSTEM,
      tool: recognitionTool(),
      maxTokens: 12000,
      timeoutMs: 180000,
      content: [
        { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: cap.b64 } },
        { type: 'text', text: `Kategorien: ${state.categories.join('; ')}\n\nUnterkategorien je Kategorie:\n${subcatContext()}\n\nAktuelles Inventar (ID | Name | Kategorie | Stückzahl | Kennwerte):\n${inventoryContext()}` }
      ]
    });
    const list = Array.isArray(r.bauteile) ? r.bauteile : [];
    const hasInv = state.items.length > 0;
    cap.items = list.map(b => {
      const kat = matchCategory(b.kategorie) || state.categories[0];
      const it = {
        sel: true,
        name: String(b.name || '').trim(),
        kategorie: kat,
        unterkategorie: matchSub(kat, b.unterkategorie),
        stueckzahl: toInt(b.stueckzahl),
        zaehlung: ['gezaehlt', 'geschaetzt', 'unsicher'].includes(String(b.zaehlung || '').toLowerCase()) ? String(b.zaehlung).toLowerCase() : 'unsicher',
        kennwerte: String(b.kennwerte || '').trim(),
        ort: String(b.ort || '').trim(),
        hinweis: String(b.hinweis || '').trim(),
        target: byId(String(b.match_id || '')) ? String(b.match_id) : ''
      };
      // Rückfall: lokaler Abgleich über identischen Namen und Kennwerte
      if (!it.target && it.name) {
        const same = state.items.find(i => norm(i.name) === norm(it.name) && norm(i.kennwerte) === norm(it.kennwerte));
        if (same) it.target = same.id;
      }
      it.matched = !!it.target;
      it.mode = hasInv && it.target ? 'add' : 'new';
      return it;
    }).filter(it => it.name || it.stueckzahl);
    cap.erkannt = r.erkannt !== false && cap.items.length > 0;
    cap.note = String(r.hinweis || '').trim();
    if (!cap.items.length) cap.items = [emptyCapItem()];
    cap.phase = 'preview';
  } catch (e) {
    cap.phase = 'error'; cap.error = e instanceof AppError ? e.message : 'Unerwarteter Fehler: ' + e.message;
  }
  renderCapture();
}

      <div class="card center">
        <p class="lead">Ein oder mehrere Bauteiltypen pro Foto. Verschiedene Typen sichtbar getrennt hinlegen, z. B. in Reihen oder Häufchen, auf einem ruhigen, hellen Hintergrund.</p>

    v.innerHTML = `<div class="card">

      <h3>Erkennung nicht möglich</h3>
      <p class="note bad" style="margin-top:0">${esc(cap.error)}</p>

        ${cap.b64 ? '<button type="button" class="btn primary block" data-act="retry">Erneut versuchen</button>' : ''}

    </div>

    return;
  }

  const hasInv = state.items.length > 0;

    const kw = t.kennwerte ? ' – ' + (t.kennwerte.length > 30 ? t.kennwerte.slice(0, 30) + '…' : t.kennwerte) : '';
    return { id: t.id, label: `${t.name}${kw} (${t.stueckzahl} Stk.)` };
  });
  const n = cap.erkannt ? cap.items.length : 0;
  v.innerHTML = `
    <div class="card">
      <img class="thumb" src="${cap.img}" alt="Aufgenommenes Foto">
      ${cap.erkannt
        ? `<p style="margin:0;font-weight:600">${n} ${n === 1 ? 'Bauteiltyp' : 'Bauteiltypen'} erkannt</p><p class="small muted" style="margin:2px 0 0">Bitte prüfen und nicht Passendes abwählen.</p>`
        : '<p class="note bad" style="margin:0">Auf dem Foto wurde kein Bauteil erkannt. Du kannst die Felder selbst ausfüllen oder ein neues Foto machen.</p>'}
      ${cap.note ? `<p class="note warn">${esc(cap.note)}</p>` : ''}
      <button type="button" class="btn small" data-act="retry" style="margin-top:12px">Erneut erkennen</button>
    </div>
    ${cap.items.map((it, i) => capItemHtml(it, i, hasInv, targetList)).join('')}
    <div class="btnrow"><button type="button" class="btn" data-act="discard">Verwerfen</button><button type="button" class="btn primary" data-act="save" id="capSaveBtn">Speichern</button></div>`;
  updateCaptureInfo();
}

function updateCaptureInfo() {
  if (cap.phase !== 'preview' || !cap.items) return;
  const hasInv = state.items.length > 0;
  // Summe pro Zieleintrag über alle ausgewählten Karten
  const sums = {};
  cap.items.forEach(it => { if (it.sel && hasInv && it.mode === 'add' && it.target) sums[it.target] = (sums[it.target] || 0) + it.stueckzahl; });
  cap.items.forEach((it, i) => {
    const card = document.querySelector(`.capitem[data-i="${i}"]`);
    if (!card) return;
    card.classList.toggle('off', !it.sel);
    const add = hasInv && it.mode === 'add';
    card.querySelectorAll('.capfields, .capkenn').forEach(el => el.classList.toggle('dim', add));
    const sel = card.querySelector('[data-f=target]');
    if (sel) sel.disabled = !add;
    const info = card.querySelector('.capinfo');
    if (!info) return;
    const t = byId(it.target);
    if (!add) { info.textContent = ''; return; }
    if (!t) { info.textContent = 'Bitte einen Eintrag wählen.'; return; }
    const total = sums[t.id] || it.stueckzahl;
    info.textContent = `Bestand: ${t.stueckzahl} → ${t.stueckzahl + total} Stk.${total !== it.stueckzahl ? ' (zusammen mit einer weiteren Karte)' : ''} Name und Kennwerte des Eintrags bleiben unverändert.`;
  });
  const btn = $('#capSaveBtn');
  if (btn) {
    const c = cap.items.filter(x => x.sel).length;
    btn.disabled = c === 0;
    btn.textContent = c === 0 ? 'Nichts ausgewählt' : c === 1 ? 'Speichern' : `${c} Einträge speichern`;
  }
}

function saveCapture() {
  const hasInv = state.items.length > 0;
  const chosen = cap.items.map((it, i) => ({ it, i })).filter(x => x.it.sel);
  if (!chosen.length) { alert('Es ist kein Bauteil ausgewählt.'); return; }
  for (const { it, i } of chosen) {
    const label = chosen.length > 1 || cap.items.length > 1 ? `${it.name || 'Bauteil ' + (i + 1)}: ` : '';
    if (hasInv && it.mode === 'add') {
      if (!byId(it.target)) { alert(`${label}Bitte einen bestehenden Eintrag wählen oder «Als neuen Eintrag anlegen» auswählen.`); return; }
      if (it.stueckzahl <= 0) { alert(`${label}Die Stückzahl muss grösser als 0 sein.`); return; }
    } else if (!it.name.trim()) { alert(`${label}Bitte einen Namen eingeben.`); return; }
  }
  let added = 0, created = 0, last = '';
  for (const { it } of chosen) {
    if (hasInv && it.mode === 'add') {
      const t = byId(it.target);
      t.stueckzahl += it.stueckzahl; t.geaendert = Date.now(); added++;
      last = `${t.name}: +${it.stueckzahl} (jetzt ${t.stueckzahl} Stk.)`;
    } else {
      const n = sanitizeItem({ id: uid(), name: it.name.trim(), kategorie: it.kategorie, unterkategorie: it.unterkategorie, stueckzahl: it.stueckzahl, kennwerte: it.kennwerte.trim() });
      state.items.push(n); created++;
      last = `Gespeichert: ${n.name} (${n.stueckzahl} Stk.)`;
    }
  }
  saveData();
  toast(chosen.length === 1 ? last : `${chosen.length} Bauteiltypen gespeichert: ${created} neu, ${added} ergänzt.`);
  resetCapture();
}

function checkSystem(mode) {
  return `Du prüfst, ob für ein Bastel- oder Elektronikprojekt genügend Material in einem privaten Inventar vorhanden ist.
Du erhältst das Inventar mit IDs und ${mode === 'liste' ? 'eine Stückliste' : 'eine Projektbeschreibung'}.
${mode === 'beschreibung'
    ? 'Erstelle zuerst eine realistische, möglichst knappe Stückliste für das beschriebene Projekt mit üblichen Hobby-Bauteilen. Führe nur Bauteile und Material auf, kein Standardwerkzeug wie Lötkolben oder Schraubendreher, ausser es ist für dieses Projekt ausdrücklich nötig. Gib im Feld projekt einen kurzen Titel an.'
    : 'Übernimm die Positionen der Stückliste vollständig und in der gegebenen Reihenfolge. Fehlt eine Mengenangabe, nimm 1 an. Gib im Feld projekt einen kurzen Titel an, abgeleitet aus der Liste, sonst «Stückliste».'}
Für jede Position:
- inventar_id: ID des Inventareintrags, der genau diesem Bauteil entspricht, sonst leerer String. Ordne nur zu, wenn Typ und relevante Kennwerte übereinstimmen.
- alternative_id: Nur wenn kein passender oder kein ausreichender Eintrag vorhanden ist, aber ein anderer Inventareintrag technisch gleichwertig einsetzbar ist (z. B. 270 Ω statt 220 Ω als LED-Vorwiderstand). Sonst leerer String. Begründe in alternative_begruendung kurz, warum der Ersatz funktioniert und worauf zu achten ist.
- hinweis: optional und kurz.
Erfinde keine Inventareinträge und keine IDs. Die verfügbaren Mengen rechnet die App selbst nach, du musst nur korrekt zuordnen. Schweizer Schreibweise (ss statt ß).`;
}

async function runCheck() {
  const text = chk.text.trim();
  if (!text) { alert(chk.mode === 'liste' ? 'Bitte zuerst eine Stückliste einfügen.' : 'Bitte zuerst das Projekt beschreiben.'); return; }
  if (!state.items.length) { alert('Das Inventar ist noch leer. Erfasse zuerst einige Bauteile.'); return; }
  chk.phase = 'loading'; chk.error = null; chk.usedMode = chk.mode;
  renderCheck();
  try {
    const r = await callClaude({
      system: checkSystem(chk.mode),
      tool: checkTool(),
      maxTokens: 16000,
      timeoutMs: 240000,
      content: [{ type: 'text', text: `${chk.mode === 'liste' ? 'Stückliste' : 'Projektbeschreibung'}:\n${text}\n\nInventar (ID | Name | Kategorie | Stückzahl | Kennwerte):\n${inventoryContext()}` }]
    });
    if (!Array.isArray(r.positionen)) throw new AppError('Die Antwort der KI enthielt keine Positionen.');
    chk.result = r; chk.phase = 'result';
  } catch (e) {
    chk.phase = 'error'; chk.error = e instanceof AppError ? e.message : 'Unerwarteter Fehler: ' + e.message;
  }
  renderCheck();
}

function evalPosition(p) {
  const need = Math.max(1, toInt(p.menge, 1));
  const it = byId(String(p.inventar_id || ''));
  const have = it ? it.stueckzahl : 0;
  const status = it && have >= need ? 'ok' : it && have > 0 ? 'warn' : 'bad';
  let alt = byId(String(p.alternative_id || ''));
  if (alt && it && alt.id === it.id) alt = null;
  const altEnough = alt ? alt.stueckzahl >= need : false;
  return { need, it, have, status, alt, altEnough };
}

function renderCheck() {
  const v = $('#chkView');
  const ph = chk.mode === 'liste'
    ? 'Materialliste hier einfügen, z. B.\n1x ESP32-DevKit\n2x Widerstand 10 kΩ\n1x DHT22 Sensor\n10x Jumper-Kabel'
    : 'Projekt beschreiben, z. B. «Wetterstation mit ESP32, die Temperatur und Luftfeuchtigkeit auf einem kleinen Display anzeigt»';
  const busy = chk.phase === 'loading';

  let html = `<div class="card">
    <div class="seg" role="tablist">
      <button type="button" data-mode="liste" class="${chk.mode === 'liste' ? 'on' : ''}">Stückliste einfügen</button>
      <button type="button" data-mode="beschreibung" class="${chk.mode === 'beschreibung' ? 'on' : ''}">Projekt beschreiben</button>
    </div>
    <textarea id="chkText" rows="7" placeholder="${esc(ph)}">${esc(chk.text)}</textarea>
    <button type="button" class="btn primary block" id="chkRun" style="margin-top:12px"${busy ? ' disabled' : ''}>Material prüfen</button>
  </div>`;

  if (busy) html += `<div class="card center"><div class="spinner"></div><p class="muted" style="margin:0">${chk.mode === 'beschreibung' ? 'Stückliste wird erstellt und geprüft …' : 'Stückliste wird geprüft …'}</p></div>`;
  if (chk.phase === 'error') html += `<div class="card"><p class="note bad" style="margin:0">${esc(chk.error)}</p></div>`;

  if (chk.phase === 'result' && chk.result) {
    const pos = chk.result.positionen.map(p => Object.assign({ p }, evalPosition(p)));
    const n = { ok: 0, warn: 0, bad: 0 };
    pos.forEach(x => n[x.status]++);
    const altCount = pos.filter(x => x.status !== 'ok' && x.alt && x.altEnough).length;
    html += `<div class="card">
      <h3>${esc(chk.result.projekt || 'Ergebnis')}</h3>
      <div class="pills">
        <span class="pill ok">${n.ok} vorhanden</span>
        ${n.warn ? `<span class="pill warn">${n.warn} teilweise</span>` : ''}
        ${n.bad ? `<span class="pill bad">${n.bad} ${n.bad === 1 ? 'fehlt' : 'fehlen'}</span>` : ''}
        ${altCount ? `<span class="pill neutral">${altCount} mit Alternative</span>` : ''}
      </div>
      ${chk.usedMode === 'beschreibung' ? '<p class="note">Die Stückliste wurde von der KI vorgeschlagen. Bitte auf Vollständigkeit prüfen.</p>' : ''}
      ${chk.result.hinweis ? `<p class="note warn">${esc(chk.result.hinweis)}</p>` : ''}
    </div>
    <div class="card flush">${pos.map(x => {
      const label = x.status === 'ok' ? 'vorhanden' : x.status === 'warn' ? `teilweise (${x.have} von ${x.need})` : 'fehlt';
      return `<div class="pos">
        <span class="dot ${x.status}"></span>
        <div class="pos-body">
          <div class="pos-head"><span class="pos-name">${x.need} × ${esc(x.p.name)}</span><span class="pos-status ${x.status}">${label}</span></div>
          ${x.it ? `<div class="pos-sub">Inventar: ${esc(x.it.name)}${x.it.kennwerte ? ' – ' + esc(x.it.kennwerte) : ''} · ${x.it.stueckzahl} Stk.</div>` : ''}
          ${x.status !== 'ok' && x.alt ? `<div class="pos-alt"><b>Alternative:</b> ${esc(x.alt.name)} · ${x.alt.stueckzahl} Stk.${x.altEnough ? '' : ' (reicht nicht ganz)'}${x.p.alternative_begruendung ? '<br>' + esc(x.p.alternative_begruendung) : ''}</div>` : ''}
          ${x.p.hinweis ? `<div class="pos-sub">${esc(x.p.hinweis)}</div>` : ''}
        </div>
      </div>`;
    }).join('')}</div>
    <button type="button" class="btn block" id="chkReset">Neue Prüfung</button>`;
  }
  v.innerHTML = html;
}

function ideaSystem(strict) {
  return `Du schlägst Bastel- und Elektronikprojekte vor, die mit einem privaten Inventar umsetzbar sind.
${strict
    ? 'Verwende ausschliesslich Teile aus dem Inventar und nicht mehr Stück, als vorhanden sind. Jedes Teil braucht eine gültige inventar_id.'
    : 'Verwende so weit wie möglich Teile aus dem Inventar. Pro Vorschlag dürfen höchstens 3 Teile fehlen. Fehlende Teile bekommen eine leere inventar_id.'}
Gängiges Standardwerkzeug (Lötkolben, Seitenschneider, Schraubendreher, Computer zum Programmieren) musst du nicht aufführen.
Liefere 4 abwechslungsreiche, realistisch umsetzbare Vorschläge. Keine Bauanleitung.
Erfinde keine IDs. Schweizer Schreibweise (ss statt ß).`;
}

async function runIdeas(more) {
  if (!state.items.length) { alert('Das Inventar ist noch leer. Erfasse zuerst einige Bauteile.'); return; }
  const wish = idea.wish.trim();
  if (!more) { idea.list = []; }
  idea.phase = 'loading'; idea.error = null; idea.usedStrict = idea.strict;
  renderIdeas();
  try {
    const avoid = idea.list.map(x => x.titel).filter(Boolean);
    const r = await callClaude({
      system: ideaSystem(idea.strict),
      tool: ideaTool(),
      maxTokens: 16000,
      timeoutMs: 240000,
      content: [{ type: 'text', text:
        `${wish ? 'Wünsche: ' + wish + '\n\n' : ''}${avoid.length ? 'Diese Vorschläge wurden bereits gemacht, bitte andere Ideen: ' + avoid.join('; ') + '\n\n' : ''}Inventar (ID | Name | Kategorie | Stückzahl | Kennwerte):\n${inventoryContext()}` }]
    });
    if (!Array.isArray(r.vorschlaege)) throw new AppError('Die Antwort der KI enthielt keine Vorschläge.');
    idea.list = idea.list.concat(r.vorschlaege.map(x => Object.assign({ strict: idea.strict }, x)));
    idea.phase = 'result';
  } catch (e) {
    idea.phase = idea.list.length ? 'result' : 'error';
    idea.error = e instanceof AppError ? e.message : 'Unerwarteter Fehler: ' + e.message;
  }
  renderIdeas();
}

function renderIdeas() {
  const v = $('#ideaView');
  const busy = idea.phase === 'loading';
  let html = `<div class="card">
    <div class="seg" role="tablist">
      <button type="button" data-strict="0" class="${!idea.strict ? 'on' : ''}">Wenige fehlende Teile</button>
      <button type="button" data-strict="1" class="${idea.strict ? 'on' : ''}">Nur vorhandenes</button>
    </div>
    <label class="field" style="margin-bottom:0"><span>Wünsche (optional)</span>
      <input id="ideaWish" type="text" value="${esc(idea.wish)}" placeholder="z. B. Sensorprojekt, für den Unterricht, an einem Nachmittag" autocomplete="off"></label>
    <button type="button" class="btn primary block" id="ideaRun" style="margin-top:12px"${busy ? ' disabled' : ''}>Ideen generieren</button>
  </div>`;

  idea.list.forEach(x => {
    const parts = (Array.isArray(x.teile) ? x.teile : []).map(t => {
      const need = Math.max(1, toInt(t.menge, 1));
      const it = byId(String(t.inventar_id || ''));
      const st = it && it.stueckzahl >= need ? 'ok' : it && it.stueckzahl > 0 ? 'warn' : 'bad';
      return { t, need, it, st };
    });
    const missing = parts.filter(p => p.st !== 'ok').length;
    const diff = { einfach: 'einfach', mittel: 'mittel', anspruchsvoll: 'anspruchsvoll' }[String(x.schwierigkeit || '').toLowerCase()] || '';
    html += `<div class="card idea">
      <h3>${esc(x.titel)}</h3>
      <div class="idea-meta">
        ${diff ? `<span class="pill neutral">${diff}</span>` : ''}
        ${missing ? `<span class="pill ${missing === parts.length ? 'bad' : 'warn'}">${missing} ${missing === 1 ? 'Teil fehlt' : 'Teile fehlen'}</span>` : '<span class="pill ok">Alles vorhanden</span>'}
      </div>
      <p>${esc(x.beschreibung)}</p>
      ${x.strict && missing ? '<p class="note warn" style="margin:0 0 10px">Obwohl nur vorhandenes Material verlangt war, reicht der Bestand laut Inventar nicht für alle Teile.</p>' : ''}
      <ul class="parts">${parts.map(p => `<li>
        <span class="dot ${p.st}"></span>
        <span class="pn">${p.need} × ${esc(p.it ? p.it.name : p.t.name)}</span>
        <span class="ps">${p.it ? p.it.stueckzahl + ' Stk. da' : 'fehlt'}</span></li>`).join('')}</ul>
    </div>`;
  });

  if (busy) html += `<div class="card center"><div class="spinner"></div><p class="muted" style="margin:0">Ideen werden gesucht …</p></div>`;
  if (idea.error && !busy) html += `<div class="card"><p class="note bad" style="margin:0">${esc(idea.error)}</p></div>`;
  if (idea.list.length && !busy) html += `<button type="button" class="btn block" id="ideaMore">Weitere Ideen</button>`;
  v.innerHTML = html;
}

   Backup, Import, CSV
   ========================================================= */
async function shareOrDownload(blob, filename) {
  let file = null;
  try { file = new File([blob], filename, { type: blob.type }); } catch (e) { file = null; }
  if (file && navigator.canShare && navigator.share) {
    let can = false;
    try { can = navigator.canShare({ files: [file] }); } catch (e) { can = false; }
    if (can) {
      try { await navigator.share({ files: [file], title: filename }); return true; }
      catch (e) { if (e.name === 'AbortError') return false; /* sonst Download versuchen */ }
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
  return true;
}

async function exportBackup() {
  const data = { app: 'diyPOOL', format: 2, version: APP_VERSION, exportiert: new Date().toISOString(), kategorien: state.categories, unterkategorien: state.subcats, symbole: state.catIcons, inventar: state.items };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const ok = await shareOrDownload(blob, `diyPOOL-Backup-${stamp()}.json`);
  if (ok) {
    state.meta.lastBackup = Date.now();
    store(K.meta, state.meta);
    updateBanner();
    toast('Backup erstellt.');
    if (ui.tab === 'einstellungen') renderSettings();
  }
}

async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e) { alert('Die Datei ist kein gültiges diyPOOL-Backup.'); return; }
  if (!data || data.app !== 'diyPOOL' || !Array.isArray(data.inventar)) { alert('Die Datei ist kein gültiges diyPOOL-Backup.'); return; }
  const items = data.inventar.map(sanitizeItem).filter(i => i.name);
  const cats = Array.isArray(data.kategorien) && data.kategorien.length ? data.kategorien.map(String).filter(Boolean) : DEFAULT_CATS.slice();
  const when = data.exportiert ? fmtDate(Date.parse(data.exportiert)) : 'unbekannt';
  if (!confirm(`Backup vom ${when} mit ${items.length} Einträgen laden?\n\nDas aktuelle Inventar (${state.items.length} Einträge) wird dabei ersetzt.`)) return;
  // IDs eindeutig halten
  const seen = new Set();
  items.forEach(i => { while (seen.has(i.id)) i.id = uid(); seen.add(i.id); });
  state.items = items; state.categories = cats;
  state.subcats = sanitizeSubcats(data.unterkategorien || null, cats);
  state.catIcons = sanitizeIcons(data.symbole || null, cats);
  state.meta.subAssignPending = !data.unterkategorien && items.length > 0;
  ui.nav = { cat: null, sub: null };
  saveData();
  state.meta.lastBackup = state.meta.lastChange;
  store(K.meta, state.meta);
  updateBanner();
  renderSettings(); renderInventory();
  toast(`Backup geladen: ${items.length} Einträge.`);
}

function exportCsv() {
  const q = s => { s = String(s ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const order = allCats();
  const rows = sortedItems().sort((a, b) => order.indexOf(a.kategorie) - order.indexOf(b.kategorie));
  const lines = ['Name;Kategorie;Unterkategorie;Stückzahl;Kennwerte'].concat(rows.map(i => [i.name, i.kategorie, i.unterkategorie || SONSTIGES, i.stueckzahl, i.kennwerte].map(q).join(';')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  shareOrDownload(blob, `diyPOOL-Inventar-${stamp()}.csv`).then(ok => { if (ok) toast('CSV erstellt.'); });
}

const ICON_EDIT = '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>';

function iconPickerHtml(sel) {
  return `<div class="iconsel"><span class="iconcur">${icon(sel)}</span><button type="button" class="btn small" data-togglepick>Symbol ändern</button></div>
    <div class="iconpick" hidden>${Object.keys(ICONS).map(k => `<button type="button" class="pick${k === sel ? ' on' : ''}" data-icon="${k}" aria-label="Symbol ${k}">${icon(k)}</button>`).join('')}</div>`;
}
function bindIconPicker(root, onPick) {
  const grid = root.querySelector('.iconpick');
  const tgl = root.querySelector('[data-togglepick]');
  if (tgl) tgl.onclick = () => { grid.hidden = !grid.hidden; tgl.textContent = grid.hidden ? 'Symbol ändern' : 'Auswahl schliessen'; };
  root.querySelectorAll('.pick').forEach(b => b.onclick = () => {
    root.querySelectorAll('.pick').forEach(x => x.classList.toggle('on', x === b));
    const cur = root.querySelector('.iconcur'); if (cur) cur.innerHTML = icon(b.dataset.icon);
    grid.hidden = true; if (tgl) tgl.textContent = 'Symbol ändern';
    onPick(b.dataset.icon);
  });
}

function renameCategory(old, n) {
  const idx = state.categories.indexOf(old);
  if (idx < 0) return;
  state.categories[idx] = n;
  state.items.forEach(i => { if (i.kategorie === old) i.kategorie = n; });
  state.subcats[n] = state.subcats[old] || []; delete state.subcats[old];
  state.catIcons[n] = state.catIcons[old] || 'box'; delete state.catIcons[old];
  if (ui.nav.cat === old) ui.nav.cat = n;
}

function openCategoryEditor(cat) {
  const draft = { name: cat, icon: catIcon(cat) };
  const count = (c, s) => state.items.filter(i => i.kategorie === c && (s === undefined || (i.unterkategorie || '') === s)).length;

  const showMain = () => {
    const c = cat;
    openSheet(`
      <h2>Kategorie bearbeiten</h2>
      <label class="field"><span>Name</span><input id="ceName" type="text" value="${esc(draft.name)}" autocomplete="off"></label>
      <div class="field"><span>Symbol</span>${iconPickerHtml(draft.icon)}</div>
      <div class="field"><span>Unterkategorien</span>
        ${subsOf(c).map((s, idx) => `<div class="catrow">${icon(validIcon(s.icon), 'sm')}<span class="cn">${esc(s.name)}</span><span class="cc">${count(c, s.name)}</span>
          <button type="button" class="iconbtn" data-subedit="${idx}" aria-label="Unterkategorie bearbeiten">${ICON_EDIT}</button></div>`).join('')}
        <div class="catrow">${icon('sonstiges', 'sm')}<span class="cn muted">${SONSTIGES} (fest)</span><span class="cc">${count(c, '')}</span></div>
        <div class="inline" style="margin-top:10px"><input id="ceSubNew" type="text" placeholder="Neue Unterkategorie" autocomplete="off"><button type="button" class="btn small" id="ceSubAdd">Hinzufügen</button></div>
      </div>
      <div class="btnrow"><button type="button" class="btn" id="ceCancel">Abbrechen</button><button type="button" class="btn primary" id="ceSave">Speichern</button></div>
      <button type="button" class="btn danger block" id="ceDelete">Kategorie löschen</button>
    `, body => {
      bindIconPicker(body, k => { draft.icon = k; });
      $('#ceName', body).oninput = e => { draft.name = e.target.value; };
      $('#ceCancel', body).onclick = closeSheet;
      $('#ceSave', body).onclick = () => {
        const n = draft.name.trim();
        if (!n) { alert('Bitte einen Namen eingeben.'); return; }
        if (n !== c && state.categories.some(x => norm(x) === norm(n))) { alert('Diese Kategorie gibt es bereits.'); return; }
        if (n !== c) renameCategory(c, n);
        state.catIcons[n] = draft.icon;
        saveData(); closeSheet(); renderSettings(); renderInventory();
      };
      $('#ceDelete', body).onclick = () => {
        const n = count(c);
        if (n) { alert(`Die Kategorie «${c}» wird von ${n} ${n === 1 ? 'Eintrag' : 'Einträgen'} verwendet. Ordne diese zuerst einer anderen Kategorie zu.`); return; }
        if (state.categories.length <= 1) { alert('Mindestens eine Kategorie muss bestehen bleiben.'); return; }
        if (!confirm(`Kategorie «${c}» mit allen Unterkategorien löschen?`)) return;
        state.categories = state.categories.filter(x => x !== c);
        delete state.subcats[c]; delete state.catIcons[c];
        saveData(); closeSheet(); renderSettings(); renderInventory();
      };
      $('#ceSubAdd', body).onclick = () => {
        const n = $('#ceSubNew', body).value.trim();
        if (!n) return;
        if (norm(n) === norm(SONSTIGES) || subsOf(c).some(s => norm(s.name) === norm(n))) { alert('Diese Unterkategorie gibt es bereits.'); return; }
        subsOf(c).push({ name: n, icon: 'box' });
        saveData(); showMain(); renderInventory();
      };
      body.querySelectorAll('[data-subedit]').forEach(b => b.onclick = () => showSub(Number(b.dataset.subedit)));
    });
  };

  const showSub = idx => {
    const c = cat;
    const s = subsOf(c)[idx];
    if (!s) return showMain();
    const sd = { name: s.name, icon: validIcon(s.icon) };
    $('#sheetBody').innerHTML = `
      <h2>Unterkategorie bearbeiten</h2>
      <p class="small muted" style="margin:-8px 0 12px">${esc(c)}</p>
      <label class="field"><span>Name</span><input id="seName" type="text" value="${esc(sd.name)}" autocomplete="off"></label>
      <div class="field"><span>Symbol</span>${iconPickerHtml(sd.icon)}</div>
      <div class="btnrow"><button type="button" class="btn" id="seBack">Zurück</button><button type="button" class="btn primary" id="seSave">Speichern</button></div>
      <button type="button" class="btn danger block" id="seDelete">Unterkategorie löschen</button>`;
    const body = $('#sheetBody');
    $('.sheet-panel').scrollTop = 0;
    bindIconPicker(body, k => { sd.icon = k; });
    $('#seName', body).oninput = e => { sd.name = e.target.value; };
    $('#seBack', body).onclick = showMain;
    $('#seSave', body).onclick = () => {
      const n = sd.name.trim();
      if (!n) { alert('Bitte einen Namen eingeben.'); return; }
      if (norm(n) === norm(SONSTIGES) || subsOf(c).some((x, i) => i !== idx && norm(x.name) === norm(n))) { alert('Diese Unterkategorie gibt es bereits.'); return; }
      if (n !== s.name) {
        state.items.forEach(i => { if (i.kategorie === c && i.unterkategorie === s.name) i.unterkategorie = n; });
        if (ui.nav.cat === c && ui.nav.sub === s.name) ui.nav.sub = n;
        s.name = n;
      }
      s.icon = sd.icon;
      saveData(); showMain(); renderInventory();
    };
    $('#seDelete', body).onclick = () => {
      const n = count(c, s.name);
      if (!confirm(n ? `Unterkategorie «${s.name}» löschen? ${n} ${n === 1 ? 'Bauteil wird' : 'Bauteile werden'} nach «${SONSTIGES}» verschoben.` : `Unterkategorie «${s.name}» löschen?`)) return;
      state.items.forEach(i => { if (i.kategorie === c && i.unterkategorie === s.name) i.unterkategorie = ''; });
      subsOf(c).splice(idx, 1);
      saveData(); showMain(); renderInventory();
    };
  };

  showMain();
}

  row.querySelector('.qty').textContent = it.stueckzahl;
  row.classList.toggle('zero', it.stueckzahl === 0);
  row.querySelector('[data-act=dec]').disabled = it.stueckzahl === 0;
  updateStats();
});

// Erfassen
['camInput', 'libInput'].forEach(id => {
  document.getElementById(id).addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) { if (ui.tab !== 'erfassen') showTab('erfassen'); handlePhoto(f); }
  });
});
$('#capView').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'manual') openItemEditor(null);
  else if (act === 'retry') runRecognition();
  else if (act === 'discard') resetCapture();
  else if (act === 'save') saveCapture();
});
function capItemFromEvent(e) {
  const card = e.target.closest('.capitem');
  return card && cap.items ? { card, it: cap.items[Number(card.dataset.i)] } : null;
}
$('#capView').addEventListener('input', e => {
  const x = capItemFromEvent(e); if (!x) return;
  const f = e.target.dataset.f;
  if (f === 'name') { x.it.name = e.target.value; const h = x.card.querySelector('.capttl'); if (h) h.textContent = e.target.value.trim() || 'Bauteil ' + (Number(x.card.dataset.i) + 1); }
  else if (f === 'kennwerte') x.it.kennwerte = e.target.value;
  else if (e.target.id && e.target.id.startsWith('capQty-')) x.it.stueckzahl = toInt(e.target.value);
  else return;
  updateCaptureInfo();
});
$('#capView').addEventListener('change', e => {
  const x = capItemFromEvent(e); if (!x) return;
  const f = e.target.dataset.f;
  if (f === 'sel') x.it.sel = e.target.checked;
  else if (f === 'kategorie') {
    x.it.kategorie = e.target.value;
    x.it.unterkategorie = matchSub(x.it.kategorie, x.it.unterkategorie);
    const ss = x.card.querySelector('[data-f=unterkategorie]');
    if (ss) ss.innerHTML = subOptions(x.it.kategorie, x.it.unterkategorie);
  }
  else if (f === 'unterkategorie') x.it.unterkategorie = e.target.value;
  else if (f === 'mode') x.it.mode = e.target.value;
  else if (f === 'target') x.it.target = e.target.value;
  else return;
  updateCaptureInfo();
});

// Prüfen
$('#chkView').addEventListener('input', e => { if (e.target.id === 'chkText') chk.text = e.target.value; });
$('#chkView').addEventListener('click', e => {
  const m = e.target.closest('[data-mode]');
  if (m) { chk.mode = m.dataset.mode; renderCheck(); return; }
  if (e.target.id === 'chkRun') runCheck();
  if (e.target.id === 'chkReset') { chk.text = ''; chk.result = null; chk.phase = 'idle'; chk.error = null; renderCheck(); window.scrollTo(0, 0); }
});

// Ideen
$('#ideaView').addEventListener('input', e => { if (e.target.id === 'ideaWish') idea.wish = e.target.value; });
$('#ideaView').addEventListener('click', e => {
  const s = e.target.closest('[data-strict]');
  if (s) { idea.strict = s.dataset.strict === '1'; renderIdeas(); return; }
  if (e.target.id === 'ideaRun') runIdeas(false);
  if (e.target.id === 'ideaMore') runIdeas(true);
});

// Einstellungen
$('#setView').addEventListener('click', async e => {
  const t = e.target.closest('button') || e.target;
  if (t.id === 'setKeyShow') { const k = $('#setKey'); const show = k.type === 'password'; k.type = show ? 'text' : 'password'; t.textContent = show ? 'Verbergen' : 'Zeigen'; return; }
  if (t.id === 'setKeySave') {
    const key = $('#setKey').value.trim();
    if (key && !key.startsWith('sk-ant-') && !confirm('Der Schlüssel beginnt nicht mit «sk-ant-». Trotzdem speichern?')) return;
    state.settings.apiKey = key; saveSettings();
    toast(key ? 'API-Schlüssel gespeichert.' : 'API-Schlüssel entfernt.');
    return;
  }
  if (t.id === 'setTest') {
    const key = $('#setKey').value.trim();
    if (key !== state.settings.apiKey) { state.settings.apiKey = key; saveSettings(); }
    t.disabled = true; t.textContent = 'Teste …';
    try {
      await callClaude({ content: [{ type: 'text', text: 'Antworte nur mit OK.' }], maxTokens: 512, timeoutMs: 60000 });
      toast(`Verbindung erfolgreich (${currentModel()}).`);
    } catch (err) { toast(err.message, true); }
    t.disabled = false; t.textContent = 'Testen';
    return;
  }
  if (t.dataset && t.dataset.catedit !== undefined) { openCategoryEditor(t.dataset.catedit); return; }
  if (t.id === 'setSubAssign') { assignSubcategories(); return; }
  if (t.id === 'catAdd') {
    const n = $('#catNew').value.trim();
    if (!n) return;
    if (state.categories.some(c => norm(c) === norm(n))) { alert('Diese Kategorie gibt es bereits.'); return; }
    state.categories.push(n); state.subcats[n] = []; state.catIcons[n] = 'box';
    saveData(); renderSettings(); toast(`Kategorie «${n}» hinzugefügt.`);
    return;
  }
  if (t.id === 'bkExport') { exportBackup(); return; }
  if (t.id === 'csvExport') { exportCsv(); return; }
});
$('#setView').addEventListener('change', e => {
  if (e.target.id === 'setModel') {
    state.settings.model = e.target.value; saveSettings();
    $('#customWrap').hidden = e.target.value !== 'custom';
    toast(`Modell: ${currentModel()}`);
  }
  if (e.target.id === 'setCustom') { state.settings.customModel = e.target.value.trim(); saveSettings(); toast(`Modell: ${currentModel()}`); }
});
$('#importInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (f) importBackup(f);
});

/* =========================================================
   Start
   ========================================================= */
updateBanner();
renderInventory();
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
